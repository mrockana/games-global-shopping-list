
networks:
    templateapi.network:

volumes:
    postgres-data:
    pgadmin-data:
    minio-data:
    redis-data:
    ollama-data:

services:
    gamesglobal.shoppinglist.webapi:
        container_name: gamesglobal.shoppinglist.webapi
        image: ${DOCKER_REGISTRY-}templateapisolutionwebapi
        build:
            context: .
            dockerfile: GamesGlobal.ShoppingList.WebApi/Dockerfile
        ports:
            - "8000:443"
            - "8001:80"
            
        networks:
            - templateapi.network
        depends_on:
            sql.database:
                condition: service_healthy
            otel-collector:
                condition: service_started
            loki:
                condition: service_started
            minio:
                condition: service_started
            redis:
                condition: service_started
            ollama-model-loader:
                condition: service_completed_successfully
        environment:
            - ASPNETCORE_ENVIRONMENT=Development
            - OtelExport__Endpoint=http://otel-collector:4317
            - ConnectionStrings__postgres=Host=webapi-app-database;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};
            - IdentityModuleOptions__JwtSigningKey=${IDENTITY_JWT_SIGNING_KEY}
            - IdentityModuleOptions__JwtExpiresInMinutes=${IDENTITY_JWT_EXPIRES_IN_MINUTES}
            - IdentityModuleOptions__HashedTokenSigningKey=${IDENTITY_HASHED_TOKEN_SIGNING_KEY}
            - FileObjectStoreOptions__Url=${FILE_OBJECT_STORE_URL}
            - FileObjectStoreOptions__User=${FILE_OBJECT_STORE_USER}
            - FileObjectStoreOptions__Secret=${FILE_OBJECT_STORE_SECRET}
            - FileObjectStoreOptions__UseSsl=${FILE_OBJECT_STORE_USE_SSL}
            - FileObjectStoreOptions__BucketName=${FILE_OBJECT_STORE_BUCKET_NAME}
            - ConnectionStrings__redis=redis:6379
            - OllamaEmbeddingOptions__Url=http://ollama:11434
        volumes:
            - ./appData/logs:/appData/logs


    sql.database:
        container_name: webapi-app-database
        image: pgvector/pgvector:pg17
        ports:
            - 5432:5432
        networks:
            - templateapi.network
        environment:
            - POSTGRES_DB=${POSTGRES_DB}
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 10s
            timeout: 5s
            retries: 5

    pgadmin:
        container_name: pgadmin
        image: dpage/pgadmin4:latest
        restart: unless-stopped
        ports:
            - "5050:80"
        networks:
            - templateapi.network
        environment:
            - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
            - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
            - PGADMIN_CONFIG_SERVER_MODE=False
            - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
        volumes:
            - pgadmin-data:/var/lib/pgadmin
        depends_on:
            sql.database:
                condition: service_healthy

    minio:
        container_name: minio
        image: minio/minio:latest
        restart: unless-stopped
        command: server /data --console-address ":9001"
        ports:
            - "9000:9000"
            - "9001:9001"
        networks:
            - templateapi.network
        environment:
            - MINIO_ROOT_USER=${MINIO_ROOT_USER}
            - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
            - MINIO_DEFAULT_BUCKETS=${MINIO_DEFAULT_BUCKETS}
        volumes:
            - minio-data:/data

    redis:
        container_name: redis
        image: redis:7-alpine
        ports:
            - "6379:6379"
        networks:
            - templateapi.network
        volumes:
            - redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5

    ollama:
        container_name: ollama
        image: ollama/ollama:latest
        restart: unless-stopped
        ports:
            - "11434:11434"
        networks:
            - templateapi.network
        volumes:
            - ollama-data:/root/.ollama
        healthcheck:
            test: ["CMD", "ollama", "list"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 20s

    ollama-model-loader:
        image: ollama/ollama:latest
        restart: on-failure
        networks:
            - templateapi.network
        environment:
            - OLLAMA_HOST=http://ollama:11434
        entrypoint: ["/bin/sh", "-c"]
        command: ["until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull embeddinggemma"]
        depends_on:
            ollama:
                condition: service_healthy

    grafana:
        container_name: grafana
        restart: unless-stopped
        image: grafana/grafana:latest
        user: "$UID:$GID"
        environment:
            - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
            - GF_SERVER_ROOT_URL=https://logs-v2.twistedqueue.com
        volumes:
            - ./appData/grafana:/var/lib/grafana
            - ./configs/grafana-config:/etc/grafana
        ports:
            - "3000:3000"
        networks:
            - templateapi.network
        depends_on:
            - prometheus
            - loki
            - jaeger

    otel-collector:
        image: otel/opentelemetry-collector:latest
        restart: on-failure
        command: ["--config=/etc/otel-collector-config.yaml"]
        volumes:
          - ./configs/otel-collector-config.yaml:/etc/otel-collector-config.yaml
        ports:
          - 1888:1888
          - 8888:8888
          - 8889:8889
          - 13133:13133
          - 4317:4317
          - 4318:4318
          - 55679:55679
        networks:
          - templateapi.network
        depends_on:
          - jaeger
          - prometheus
          - loki

    jaeger:
        image: jaegertracing/jaeger:2.2.0
        environment:
            - LOG_LEVEL=debug
        ports:
            - "16686:16686"

        networks:
            - templateapi.network

    loki:
        image: grafana/loki:latest
        ports:
            - "3100:3100"
        networks:
            - templateapi.network

    promtail:
        image: grafana/promtail:latest
        command: ["-config.file=/etc/promtail/promtail-config.yaml"]
        volumes:
            - ./appData/promatail/log:/var/log
            - ./configs/promtail-config.yaml:/etc/promtail/promtail-config.yaml
        networks:
            - templateapi.network


    prometheus:
        image: prom/prometheus:latest
        restart: unless-stopped
        command:
          - '--config.file=/etc/prometheus/prometheus.yml'
        volumes:
          - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml
          - ./appData/prometheus:/prometheus
        ports:
          - "9090:9090"
        networks:
          - templateapi.network


